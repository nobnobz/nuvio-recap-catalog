name: Validate catalog
on:
  push:
    branches: [main]
    paths: [catalog.json, series.json, tests/**, scripts/**, .github/workflows/review.yml, package.json, package-lock.json, wrangler.jsonc, .github/workflows/publish.yml]
  pull_request:
    paths: [catalog.json, series.json, scripts/**, tests/**, .github/workflows/review.yml, package.json, package-lock.json, wrangler.jsonc, .github/workflows/publish.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recap-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/build.py
        env:
          CATALOG_URL: ${{ vars.CATALOG_URL }}
